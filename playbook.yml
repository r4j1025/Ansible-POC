---
- name: Addition POC
  hosts: localhost
  connection: local
  gather_facts: false
 
  tasks:
 
    - name: Execute Python addition script
      command:
        argv:
          - python3
          - "{{ playbook_dir }}/add_numbers.py"
          - "{{ input_num1 | string }}"
          - "{{ input_num2 | string }}"
      register: result
 
    - name: Publish structured output
      set_stats:
        data:
          status: SUCCESS
          input_num1: "{{ input_num1 | int }}"
          input_num2: "{{ input_num2 | int }}"
          result: "{{ result.stdout | int }}"